<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Pollymetric</title>
  <!-- Two half-rings meet at x=274. The left one is larger by half the stroke (36),
       so both tops align at y=70 and the right ring's outer end (y=370) lands exactly on
       the left ring's inner end, stepping the stroke down into the p's tail. -->
  <path fill="#0A0A0A" d="
    M274 70 A150 150 0 0 1 274 370 L274 298 A78 78 0 0 0 274 142 Z
    M274 70 A186 186 0 0 0 274 442 L274 370 A114 114 0 0 1 274 142 Z"/>
  <circle cx="250" cy="231" r="29" fill="#0A0A0A"/>
</svg>
